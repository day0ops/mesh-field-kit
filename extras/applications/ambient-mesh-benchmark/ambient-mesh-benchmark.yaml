apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  namespace: default
  labels:
    app: ledger-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger-service
  template:
    metadata:
      labels:
        app: ledger-service
        version: v1
    spec:
      containers:
        - name: ledger-service
          image: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/ledger-service:v0.1.4
          ports:
            - containerPort: 8081
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: 'http://opentelemetry-collector-traces.telemetry.svc.cluster.local:4317'
            - name: OTEL_SERVICE_NAME
              value: ledger-service
          resources:
            # No CPU limit - a hard limit causes Kubernetes CFS quota
            # throttling in short bursts even when average usage looks low,
            # which measurably added tail latency under benchmark load.
            requests:
              cpu: '500m'
              memory: '512Mi'
            limits:
              memory: '512Mi'
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-service
  namespace: default
spec:
  selector:
    app: ledger-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      appProtocol: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: default
  labels:
    app: account-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
        version: v1
    spec:
      containers:
        - name: account-service
          image: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/account-service:v0.1.4
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: 'http://opentelemetry-collector-traces.telemetry.svc.cluster.local:4317'
            - name: OTEL_SERVICE_NAME
              value: account-service
            - name: LEDGER_SERVICE_BASE_URL
              value: 'http://ledger-service:8081'
          resources:
            # No CPU limit - a hard limit causes Kubernetes CFS quota
            # throttling in short bursts even when average usage looks low,
            # which measurably added tail latency under benchmark load.
            requests:
              cpu: '500m'
              memory: '512Mi'
            limits:
              memory: '512Mi'
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: default
spec:
  selector:
    app: account-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      appProtocol: http
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ledger-service
  namespace: default
spec:
  selector:
    matchLabels:
      app: ledger-service
  podMetricsEndpoints:
    - path: /actuator/prometheus
      targetPort: 8081
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: account-service
  namespace: default
spec:
  selector:
    matchLabels:
      app: account-service
  podMetricsEndpoints:
    - path: /actuator/prometheus
      targetPort: 8080
      interval: 15s
