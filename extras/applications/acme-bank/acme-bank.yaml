# extras/applications/acme-bank/acme-bank.yaml
#
# Acme Bank: a polyglot core-banking demo (github.com/day0ops/acme-bank).
# Image tags are pinned to v0.0.2 - bump every Deployment's image tag below
# when a new Acme Bank release is cut; this file does not auto-track releases.
#
# Expects the 'keycloak' addon (with an 'acme-bank' realm - see this repo's
# Keycloak addon roles: support) and the 'redpanda' addon already installed
# on the cluster. This application only deploys Acme Bank's own services and
# their Postgres instances, not its platform dependencies.

# ---------- Postgres: accounts ----------
apiVersion: v1
kind: Service
metadata:
  name: accounts-postgres
  namespace: acme-bank
spec:
  selector: { app: accounts-postgres }
  ports:
    - { port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts-postgres
  namespace: acme-bank
spec:
  replicas: 1
  selector:
    matchLabels: { app: accounts-postgres }
  template:
    metadata:
      labels: { app: accounts-postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: 'accounts' }
            - { name: POSTGRES_PASSWORD, value: 'accounts' }
            - { name: POSTGRES_DB, value: 'accounts' }
---
