# ---------- Accounts ----------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: accounts
  namespace: acme-bank
---
apiVersion: v1
kind: Service
metadata:
  name: accounts
  namespace: acme-bank
spec:
  selector: { app: accounts }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
    - { name: grpc, port: 9090, targetPort: 9090 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts
  namespace: acme-bank
  labels: { app: accounts }
spec:
  replicas: 1
  selector:
    matchLabels: { app: accounts }
  template:
    metadata:
      labels: { app: accounts }
    spec:
      serviceAccountName: accounts
      containers:
        - name: accounts
          image: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/acme-bank-accounts:v0.0.2
          ports:
            - { containerPort: 8080, name: http }
            - { containerPort: 9090, name: grpc }
          env:
            - name: DATABASE_URL
              value: 'postgres://accounts:accounts@accounts-postgres:5432/accounts?sslmode=disable'
            - name: JWKS_URL
              value: 'http://keycloak.keycloak.svc.cluster.local:8080/realms/acme-bank/protocol/openid-connect/certs'
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: 'opentelemetry-collector-traces.telemetry.svc.cluster.local:4317'
---
