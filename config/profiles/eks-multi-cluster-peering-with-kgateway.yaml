apiVersion: mesh.demo/v1
kind: Profile
metadata:
  name: eks-multi-cluster-peering-with-kgateway
  description: |
    Multicluster ambient mesh with helm-based peering
    - kgateway enabled
    - Cilium addon enabled
    - SPIRE addon enabled

spec:
  infra: eks-multi-cluster
  environment: aws-dev

  mesh:
    istioVersion: 1.30.3
    gatewayApiVersion: v1.5.0
    profile: ambient
    peering: helm

    certificates:
      mode: self-signed

    image:
      istioRepo: us-docker.pkg.dev/soloio-img/istio
      helmIstioRepo: us-docker.pkg.dev/soloio-img/istio-helm
      tag: 1.30.3-solo

    components:
      - name: base
        values:
          defaultRevision: ""

      - name: istiod
        values:
          env:
            # disables trust domain validation when generating xDS config, set when different domains (false)
            PILOT_SKIP_VALIDATE_TRUST_DOMAIN: "true"
            # enables new IP autoallocation controller for ServiceEntry resources lacking user-supplied addresses (true)
            PILOT_ENABLE_IP_AUTOALLOCATE: "true"
            # disables legacy remote-secrets-based multicluster entirely (true)
            DISABLE_LEGACY_MULTICLUSTER: "true"
            # ----- optional -----
            # gate for entire debug endpoint auth system. When false: all /debug/* endpoints open to any caller, no SPIFFE check, no namespace restriction. related to DEBUG_ENDPOINT_AUTH_ALLOWED_NAMESPACES (true)
            ENABLE_DEBUG_ENDPOINT_AUTH: "true"
            # needs full access to istiod debug endpoints to function
            DEBUG_ENDPOINT_AUTH_ALLOWED_NAMESPACES: "gloo-mesh"
            # allows Kubernetes Service selectors to match WorkloadEntry resources (not just pods) (true)
            PILOT_ENABLE_K8S_SELECT_WORKLOAD_ENTRIES: "true"
          global:
            multiCluster:
              clusterName: "{{cluster.name}}"
            network: "{{cluster.name}}"
            proxy:
              clusterDomain: cluster.local
          gateways:
            spire:
              workloads: true
          meshConfig:
            accessLogFile: /dev/stdout
            trustDomain: "{{cluster.name}}.local"
            defaultConfig:
              proxyMetadata:
                # tells the sidecar/agent to intercept DNS queries
                ISTIO_META_DNS_CAPTURE: "true"
          pilot:
            cni:
              namespace: istio-system
              enabled: true
          platforms:
            # activates push-based multicluster peering system in istiod
            peering:
              enabled: true

      - name: cni
        values:
          ambient:
            dnsCapture: true
          excludeNamespaces:
            - istio-system
            - kube-system

      - name: ztunnel
        values:
          env:
            # enables L7 observability feature (false)
            L7_ENABLED: "true"
            # start DNS proxy
            ISTIO_META_DNS_CAPTURE: "true"
            # required when a unique trust domain is set for each cluster
            SKIP_VALIDATE_TRUST_DOMAIN: "true"
          spire:
            enabled: true
          configValidation: true
          istioNamespace: istio-system
          namespace: istio-system
          multiCluster:
            clusterName: "{{cluster.name}}"
          network: "{{cluster.name}}"
          proxy:
            clusterDomain: cluster.local
          terminationGracePeriodSeconds: 29
          variant: distroless

      # east-west gateway deployed via Solo peering chart.
      - name: peering-eastwest
        values:
          eastwest:
            cluster: "{{cluster.name}}"
            network: "{{cluster.name}}"

      # peering remote
      - name: peering-remote
        values:
          trustDomain: "{{cluster.name}}.local"
          addressType: Hostname
          preferredDataplaneServiceType: LoadBalancer

  addons:
    clusters:
      - name: east
        addons:
          - name: spire
            phase: pre
            certMode: self-signed
            trustDomain: "{{cluster.name}}.local"

          - name: external-dns
            description: Automatic DNS record management via Route53
            namespace: external-dns
            config:
              provider: route53
              domainFilter: "{{env.dns.childZone}}.{{env.dns.parentZone.domain}}"
              region: "{{env.aws.region}}"

          - name: keycloak
            description: Keycloak OIDC Identity Provider
            namespace: keycloak
            keycloakNamespace: keycloak
            keycloakVersion: 26.7.0
            keycloakImage: "{{env.images.keycloak}}"
            hostname: "{{env.domains.keycloak}}"
            protocol: "{{env.keycloak.scheme}}"
            tls:
              enabled: true
              secretName: keycloak-tls
              createCertificate: true
              clusterIssuerName: letsencrypt-dns
            soloUIClients:
              enabled: true
              realm: solo-ui
              hostname: "https://{{env.domains.soloUI}}"
              backendClientId: solo-ui-backend
              backendClientSecret: solo-ui-backend-secret
              frontendClientId: solo-ui-frontend

          - name: telemetry
            description: OpenTelemetry observability stack (Prometheus, Grafana, Loki, Tempo)
            phase: post
            namespace: telemetry
            chartVersions:
              kube-prom-stack: 88.0.1
              loki: 7.2.0
              tempo: 1.61.3
              alloy: 1.11.0
              otel: 0.165.0
            config:
              globalExport: true
              soloUiNamespace: solo-enterprise
              database:
                storageClass: gp3
                storageSize: 100Gi
              retention: 120h
              grafanaServiceType: LoadBalancer
              grafanaHostname: '{{env.domains.grafana}}'

          - name: solo-ui
            mode: management
            version: 0.5.3
            phase: post
            namespace: solo-enterprise
            serviceType: LoadBalancer
            telemetryNamespace: telemetry
            hostname: "{{env.domains.soloUI}}"
            tls:
              enabled: true
              secretName: solo-ui-tls
              issuer: letsencrypt-dns
            oidc:
              enabled: true
              issuerUrl: "https://{{env.domains.keycloak}}/realms/solo-ui"
              backendClientId: solo-ui-backend
              backendClientSecret: solo-ui-backend-secret
              frontendClientId: solo-ui-frontend

          - name: kgateway
            description: Kubernetes Gateway API ingress controller
            version: "2.3.1"
            phase: post
            namespace: kgateway-system
            config:
              enterprise: true
              ambientEnabled: true
              telemetryNamespace: telemetry
              tracesCollectorName: opentelemetry-collector-traces
              tracesCollectorNamespace: telemetry
              logsCollectorName: opentelemetry-collector-logs
              logsCollectorNamespace: telemetry
              gateway:
                name: bookinfo-gateway
                namespace: kgateway-system
                hostname: "{{env.domains.app}}"
                port: 80
                protocol: HTTP
                allowedRoutes:
                  namespaces:
                    from: All

      - name: west
        addons:
          - name: spire
            phase: pre
            certMode: self-signed
            trustDomain: "{{cluster.name}}.local"

          - name: solo-ui
            mode: relay
            phase: post
            version: 0.5.3
            namespace: solo-enterprise
            tunnel:
              fqdn: solo-enterprise-ui.solo-enterprise.mesh.internal
              port: 9000
            telemetry:
              fqdn: solo-enterprise-telemetry-gateway.solo-enterprise.mesh.internal

    global:
      - name: cilium
        description: eBPF-based CNI in chaining mode for network policy and observability
        version: 1.19.4
        mode: chaining
        chainingTarget: aws-cni
        enableHealthProbePolicy: true

      - name: cert-manager
        description: Certificate management for TLS
        version: 1.20.2
        namespace: cert-manager
        config:
          letsencrypt:
            enabled: true
            email: "{{env.acme.email}}"
            region: "{{env.aws.region}}"
