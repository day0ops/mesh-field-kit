apiVersion: mesh.demo/v1
kind: Profile
metadata:
  name: eks-single-cluster-mesh-with-kgateway
  description: Single-cluster ambient mesh with Cilium CNI, kgateway ingress, Keycloak (acme-bank realm), Redpanda, plus the telemetry stack (Prometheus, Grafana, Loki, Tempo)

spec:
  infra: eks-single-cluster
  environment: aws-dev

  mesh:
    istioVersion: 1.30.5
    gatewayApiVersion: v1.5.0
    profile: ambient

    image:
      istioRepo: us-docker.pkg.dev/soloio-img/istio
      helmIstioRepo: us-docker.pkg.dev/soloio-img/istio-helm
      tag: 1.30.5-solo

    components:
      - base
      - name: istiod
        values:
          global:
            network: '{{cluster.name}}'
          meshConfig:
            accessLogFile: /dev/stdout
            defaultConfig:
              proxyMetadata:
                ISTIO_META_DNS_CAPTURE: 'true'
          env:
            PILOT_ENABLE_IP_AUTOALLOCATE: 'true'
            AMBIENT_SCOPED_ADDRESS_PUSHES: 'true'
          pilot:
            cni:
              namespace: istio-system
              enabled: true
      - cni
      - name: ztunnel
        values:
          env:
            ISTIO_META_DNS_CAPTURE: 'true'
            ENABLE_WORKLOAD_CLAIMS: 'true'
          network: '{{cluster.name}}'

  addons:
    - name: cilium
      description: eBPF-based CNI in chaining mode
      version: 1.20.2
      mode: chaining
      enableHealthProbePolicy: true

    - name: external-dns
      description: Route53 records for acme-bank's public hostname - required for the sourceRanges restriction to take effect
      version: '{{env.addons.external-dns.version}}'
      namespace: external-dns
      phase: pre
      config:
        provider: route53
        domainFilter: '{{env.dns.childZone}}.{{env.dns.parentZone.domain}}'
        region: '{{env.aws.region}}'
        txtOwnerId: '{{env.dns.txtOwnerId}}'

    - name: cert-manager
      description: Certificate management for TLS (self-signed issuer backs Keycloak's TLS cert; letsencrypt-dns backs acme-bank's public hostname)
      version: '{{env.addons.cert-manager.version}}'
      namespace: cert-manager
      config:
        letsencrypt:
          enabled: true
          email: '{{env.acme.email}}'
          region: '{{env.aws.region}}'

    - name: telemetry
      description: OpenTelemetry observability stack (Prometheus, Grafana, Loki, Tempo)
      phase: post
      namespace: telemetry
      chartVersions: '{{env.addons.telemetry}}'
      config:
        database:
          storageClass: gp3
          storageSize: 100Gi
        retention: 120h
        grafanaServiceType: LoadBalancer
        grafanaHostname: '{{env.domains.core.grafana}}'
        sourceRanges: '{{env.security.vpnSourceRanges}}'

    - name: kgateway
      description: Kubernetes Gateway API ingress controller (OSS)
      phase: post
      namespace: kgateway-system
      config:
        ambientEnabled: true

    - name: keycloak
      description: Keycloak OIDC Identity Provider, with Acme Bank's realm
      phase: post
      namespace: keycloak
      hostname: '{{env.domains.core.keycloak}}'
      keycloakNamespace: keycloak
      realms:
        - realm: acme-bank
          roles:
            - name: customer
            - name: banker
            - name: admin
              composite: [banker]
          clients:
            - clientId: acme-bank-web
              type: public
              flows: [authorization-code]
              clientAttributes:
                pkce.code.challenge.method: S256
          users:
            - username: alice
              email: alice@acme-bank.example.com
              firstName: Alice
              lastName: Customer
              passwordEnvVar: ACME_BANK_ALICE_PASSWORD
              roles: [customer]
            - username: bob
              email: bob@acme-bank.example.com
              firstName: Bob
              lastName: Banker
              passwordEnvVar: ACME_BANK_BOB_PASSWORD
              roles: [banker]
            - username: carol
              email: carol@acme-bank.example.com
              firstName: Carol
              lastName: Admin
              passwordEnvVar: ACME_BANK_CAROL_PASSWORD
              roles: [admin]

    - name: redpanda
      description: Kafka-API event broker backing Acme Bank's async eventing
      phase: post
      namespace: redpanda
