apiVersion: mesh.demo/v1
kind: Profile
metadata:
  name: eks-single-cluster-mesh-sidecar
  description: Single-cluster classic Istio sidecar mesh (no ambient components) — starting point for the sidecar-to-ambient migration demo

spec:
  infra: eks-single-cluster
  environment: aws-dev

  mesh:
    istioVersion: 1.30.3
    profile: demo
    istioRevision: stable

    components:
      - base
      - istiod
