apiVersion: mesh.demo/v1
kind: Profile
metadata:
  name: eks-single-cluster-mesh-with-spire
  description: Single-cluster ambient mesh with SPIRE workload identity attestation

spec:
  infra: eks-single-cluster
  environment: aws-dev

  mesh:
    istioVersion: 1.30.3
    gatewayApiVersion: v1.5.0
    profile: ambient

    image:
      istioRepo: us-docker.pkg.dev/soloio-img/istio
      helmIstioRepo: us-docker.pkg.dev/soloio-img/istio-helm
      tag: 1.30.3-solo

    components:
      - base
      - name: istiod
        values:
          global:
            network: '{{cluster.name}}'
          gateways:
            spire:
              workloads: true
          meshConfig:
            accessLogFile: /dev/stdout
            defaultConfig:
              proxyMetadata:
                ISTIO_META_DNS_CAPTURE: 'true'
            trustDomain: '{{ cluster.name }}'
          env:
            PILOT_ENABLE_IP_AUTOALLOCATE: 'true'
            PILOT_SKIP_VALIDATE_TRUST_DOMAIN: 'true'
            # scopes ambient Address push updates to affected waypoints only, skipping sidecar/gateway proxies entirely (true)
            AMBIENT_SCOPED_ADDRESS_PUSHES: 'true'
          pilot:
            cni:
              namespace: istio-system
              enabled: true
      - cni
      - name: ztunnel
        values:
          spire:
            enabled: true
          env:
            # validates that an ancestor CA cert in the chain carries a SAN matching the
            # leaf's trust domain, rejecting spoofed certs from an untrusted CA
            VALIDATE_SPIFFE_TRUST_DOMAIN_NAMES: STRICT
          network: '{{cluster.name}}'

  addons:
    - name: spire
      phase: pre
      certMode: self-signed
