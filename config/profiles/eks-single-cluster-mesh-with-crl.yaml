apiVersion: mesh.demo/v1
kind: Profile
metadata:
  name: eks-single-cluster-mesh-with-crl
  description: Single-cluster ambient mesh with a plugged-in CA and certificate revocation list (CRL) enforcement

spec:
  infra: eks-single-cluster
  environment: aws-dev

  mesh:
    istioVersion: 1.30.3
    gatewayApiVersion: v1.5.0
    profile: ambient

    image:
      istioRepo: us-docker.pkg.dev/soloio-img/istio
      helmIstioRepo: us-docker.pkg.dev/soloio-img/istio-helm
      tag: 1.30.3-solo

    components:
      - base
      - name: istiod
        values:
          global:
            network: "{{cluster.name}}"
          meshConfig:
            accessLogFile: /dev/stdout
            defaultConfig:
              proxyMetadata:
                ISTIO_META_DNS_CAPTURE: "true"
          env:
            PILOT_ENABLE_IP_AUTOALLOCATE: "true"
            # propagates the cacerts secret's ca-crl.pem entry to a ConfigMap in every namespace
            PILOT_ENABLE_CA_CRL: "true"
          pilot:
            cni:
              namespace: istio-system
              enabled: true
      - cni
      - name: ztunnel
        values:
          env:
            ISTIO_META_DNS_CAPTURE: "true"
          # rejects peers whose cert serial number appears in the propagated CRL
          peerCaCrl:
            enabled: true
          network: "{{cluster.name}}"

    certificates:
      mode: self-signed
