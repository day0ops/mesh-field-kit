apiVersion: mesh.demo/v1
kind: Profile
metadata:
  name: eks-single-cluster-mesh-with-cilium
  description: Single-cluster ambient mesh with Cilium CNI chaining

spec:
  infra: eks-single-cluster
  environment: aws-dev

  mesh:
    istioVersion: 1.30.3
    gatewayApiVersion: v1.5.0
    profile: ambient

    image:
      istioRepo: us-docker.pkg.dev/soloio-img/istio
      helmIstioRepo: us-docker.pkg.dev/soloio-img/istio-helm
      tag: 1.30.3-solo

    components:
      - base
      - name: istiod
        values:
          global:
            network: "{{cluster.name}}"
          meshConfig:
            accessLogFile: /dev/stdout
            defaultConfig:
              proxyMetadata:
                ISTIO_META_DNS_CAPTURE: "true"
          env:
            PILOT_ENABLE_IP_AUTOALLOCATE: "true"
          pilot:
            cni:
              namespace: istio-system
              enabled: true
      - cni
      - name: ztunnel
        values:
          env:
            ISTIO_META_DNS_CAPTURE: "true"
            # embeds pod annotation claims (solo.io.security-claims/*) into workload certs for CEL-based L4 authorization
            ENABLE_WORKLOAD_CLAIMS: "true"
          network: "{{cluster.name}}"

  addons:
    - name: cilium
      description: eBPF-based CNI in chaining mode
      version: 1.19.4
      mode: chaining
      enableHealthProbePolicy: true

    - name: telemetry
      description: OpenTelemetry observability stack (Prometheus, Grafana, Loki, Tempo)
      phase: post
      namespace: telemetry
      chartVersions:
        kube-prom-stack: 88.0.1
        loki: 7.2.0
        tempo: 1.61.3
        alloy: 1.11.0
        otel: 0.165.0
      config:
        database:
          storageClass: gp3
          storageSize: 100Gi
        retention: 120h
        grafanaServiceType: LoadBalancer
        grafanaHostname: '{{env.domains.grafana}}'
