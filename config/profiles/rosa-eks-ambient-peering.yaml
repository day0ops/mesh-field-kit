apiVersion: mesh.demo/v1
kind: Profile
metadata:
  name: rosa-eks-ambient-peering
  description: |
    Solo Istio Ambient Enterprise on both a ROSA (HCP) cluster and an EKS
    cluster, linked via this framework's normal Solo peering multicluster
    mechanism. SPIRE (independent root per cluster, federated) provides
    workload identity attestation on both clusters. Solo UI + telemetry run
    on the ROSA (management) cluster.

spec:
  infra: rosa-eks-multi-cluster
  environment: aws-dev

  mesh:
    istioVersion: 1.30.4
    gatewayApiVersion: v1.5.0
    profile: ambient
    peering: helm

    certificates:
      mode: self-signed

    image:
      istioRepo: us-docker.pkg.dev/soloio-img/istio
      helmIstioRepo: us-docker.pkg.dev/soloio-img/istio-helm
      tag: 1.30.4-solo

    components:
      - name: base

      - name: istiod
        values:
          global:
            multiCluster:
              clusterName: '{{cluster.name}}'
            network: '{{cluster.name}}'
            proxy:
              clusterDomain: cluster.local
            gateways:
              spire:
                workloads: true
          meshConfig:
            accessLogFile: /dev/stdout
            trustDomain: '{{cluster.name}}.local'
          platforms:
            peering:
              enabled: true
          env:
            PILOT_SKIP_VALIDATE_TRUST_DOMAIN: 'true'

      - name: cni
        values:
          ambient:
            dnsCapture: true
          excludeNamespaces:
            - istio-system
            - kube-system

      - name: ztunnel
        values:
          istioNamespace: istio-system
          namespace: istio-system
          multiCluster:
            clusterName: '{{cluster.name}}'
          network: '{{cluster.name}}'
          proxy:
            clusterDomain: cluster.local
          variant: distroless
          spire:
            enabled: true
          env:
            SKIP_VALIDATE_TRUST_DOMAIN: 'true'

      - name: peering-eastwest
        values:
          eastwest:
            cluster: '{{cluster.name}}'
            network: '{{cluster.name}}'
            deployment:
              spec:
                template:
                  spec:
                    containers:
                      - name: istio-proxy
                        env:
                          - name: SPIRE_ENABLED
                            value: 'false'

      - name: peering-remote
        values:
          trustDomain: '{{cluster.name}}.local'
          addressType: Hostname
          preferredDataplaneServiceType: LoadBalancer

    clusters:
      - name: rosa-cluster
        componentNamespaces:
          cni: kube-system
          ztunnel: kube-system
        componentValues:
          base:
            global:
              platform: openshift
          istiod:
            global:
              platform: openshift
          cni:
            global:
              platform: openshift
          ztunnel:
            global:
              platform: openshift

  addons:
    clusters:
      - name: rosa-cluster
        addons:
          - name: openshift-scc
            phase: pre

          - name: spire
            phase: pre
            certMode: self-signed
            trustDomain: '{{cluster.name}}.local'
            distinctRoots: true

          - name: telemetry
            description: OpenTelemetry observability stack (Prometheus, Grafana, Loki, Tempo)
            phase: post
            namespace: telemetry
            chartVersions:
              kube-prom-stack: 88.0.1
              loki: 7.2.0
              tempo: 1.61.3
              alloy: 1.11.0
              otel: 0.165.0
            config:
              database:
                storageClass: gp3
                storageSize: 50Gi
              retention: 120h
              grafanaServiceType: LoadBalancer

          - name: solo-ui
            mode: management
            version: 0.5.3
            phase: post
            namespace: solo-enterprise
            serviceType: LoadBalancer
            telemetryNamespace: telemetry

      - name: eks-cluster
        addons:
          - name: cilium
            description: eBPF-based CNI in chaining mode for network policy and observability
            version: 1.19.4
            mode: chaining
            chainingTarget: aws-cni
            enableHealthProbePolicy: true

          - name: spire
            phase: pre
            certMode: self-signed
            trustDomain: '{{cluster.name}}.local'
            distinctRoots: true
