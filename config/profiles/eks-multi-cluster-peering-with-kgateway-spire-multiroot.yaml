apiVersion: mesh.demo/v1
kind: Profile
metadata:
  name: eks-multi-cluster-peering-with-kgateway-spire-multiroot
  description: |
    Minimal profile for testing SPIRE multiRoot: an independent root bidirectionally federated with istiod's cacerts root instead of sharing one. Based on eks-multi-cluster-peering-with-kgateway, stripped of keycloak/solo-ui/telemetry for a small, fast install.

spec:
  infra: eks-multi-cluster
  environment: aws-dev

  mesh:
    istioVersion: 1.30.3
    gatewayApiVersion: v1.5.0
    profile: ambient
    peering: helm

    certificates:
      mode: self-signed

    image:
      istioRepo: us-docker.pkg.dev/soloio-img/istio
      helmIstioRepo: us-docker.pkg.dev/soloio-img/istio-helm
      tag: 1.30.3-solo

    components:
      - name: base
        values:
          defaultRevision: ''

      - name: istiod
        values:
          env:
            # disables trust domain validation when generating xDS config, set when different domains (false)
            PILOT_SKIP_VALIDATE_TRUST_DOMAIN: 'true'
            # enables new IP autoallocation controller for ServiceEntry resources lacking user-supplied addresses (true)
            PILOT_ENABLE_IP_AUTOALLOCATE: 'true'
            # disables legacy remote-secrets-based multicluster entirely (true)
            DISABLE_LEGACY_MULTICLUSTER: 'true'
            # ----- optional -----
            # gate for entire debug endpoint auth system. When false: all /debug/* endpoints open to any caller, no SPIFFE check, no namespace restriction. related to DEBUG_ENDPOINT_AUTH_ALLOWED_NAMESPACES (true)
            ENABLE_DEBUG_ENDPOINT_AUTH: 'true'
            # needs full access to istiod debug endpoints to function
            DEBUG_ENDPOINT_AUTH_ALLOWED_NAMESPACES: 'gloo-mesh'
            # allows Kubernetes Service selectors to match WorkloadEntry resources (not just pods) (true)
            PILOT_ENABLE_K8S_SELECT_WORKLOAD_ENTRIES: 'true'
            # scopes ambient Address push updates to affected waypoints only, skipping sidecar/gateway proxies entirely (true)
            AMBIENT_SCOPED_ADDRESS_PUSHES: 'true'
          global:
            multiCluster:
              clusterName: '{{cluster.name}}'
            network: '{{cluster.name}}'
            proxy:
              clusterDomain: cluster.local
          gateways:
            spire:
              workloads: true
          meshConfig:
            accessLogFile: /dev/stdout
            trustDomain: '{{cluster.name}}.local'
            defaultConfig:
              proxyMetadata:
                # tells the sidecar/agent to intercept DNS queries
                ISTIO_META_DNS_CAPTURE: 'true'
          pilot:
            cni:
              namespace: istio-system
              enabled: true
          platforms:
            # activates push-based multicluster peering system in istiod
            peering:
              enabled: true

      - name: cni
        values:
          ambient:
            dnsCapture: true
          excludeNamespaces:
            - istio-system
            - kube-system

      - name: ztunnel
        values:
          env:
            # enables L7 observability feature (false)
            L7_ENABLED: 'true'
            # start DNS proxy
            ISTIO_META_DNS_CAPTURE: 'true'
            # required when a unique trust domain is set for each cluster
            SKIP_VALIDATE_TRUST_DOMAIN: 'true'
          spire:
            enabled: true
          configValidation: true
          istioNamespace: istio-system
          namespace: istio-system
          multiCluster:
            clusterName: '{{cluster.name}}'
          network: '{{cluster.name}}'
          proxy:
            clusterDomain: cluster.local
          terminationGracePeriodSeconds: 29
          variant: distroless

      # SPIRE_ENABLED=false is intentional: Solo's SPIRE docs never register the
      # east-west gateway with SPIRE, and ztunnel's gateway-mode SPIRE client
      # (dedicated_ca_client.rs) has a confirmed DER/PEM parsing bug. Cross-cluster
      # mTLS works because the spire addon bidirectionally federates its independent
      # root with istiod's cacerts root (multiRoot: true, see addons/spire/index.js).
      - name: peering-eastwest
        values:
          eastwest:
            cluster: '{{cluster.name}}'
            network: '{{cluster.name}}'
            deployment:
              spec:
                template:
                  spec:
                    containers:
                      - name: istio-proxy
                        env:
                          - name: SPIRE_ENABLED
                            value: 'false'

      # peering remote
      - name: peering-remote
        values:
          trustDomain: '{{cluster.name}}.local'
          addressType: Hostname
          preferredDataplaneServiceType: LoadBalancer

  addons:
    clusters:
      - name: east
        addons:
          - name: spire
            phase: pre
            certMode: self-signed
            trustDomain: '{{cluster.name}}.local'
            multiRoot: true

          - name: external-dns
            description: Automatic DNS record management via Route53
            namespace: external-dns
            config:
              provider: route53
              domainFilter: '{{env.dns.childZone}}.{{env.dns.parentZone.domain}}'
              region: '{{env.aws.region}}'
              txtOwnerId: '{{env.dns.txtOwnerId}}'

          - name: kgateway
            description: Kubernetes Gateway API ingress controller
            version: '2.3.1'
            phase: post
            namespace: kgateway-system
            config:
              enterprise: true
              ambientEnabled: true
              # No telemetry addon in this minimal profile - point OTel policy backends
              # at a namespace that exists (kgateway-system) rather than the default
              # 'telemetry', which would make the ReferenceGrant apply fail. Nothing
              # listens there, so logs/traces are just dropped - harmless for this test.
              tracesCollectorNamespace: kgateway-system
              logsCollectorNamespace: kgateway-system
              gateway:
                name: bookinfo-gateway
                namespace: kgateway-system
                hostname: '{{env.domains.app}}'
                port: 80
                protocol: HTTP
                allowedRoutes:
                  namespaces:
                    from: All

      - name: west
        addons:
          - name: spire
            phase: pre
            certMode: self-signed
            trustDomain: '{{cluster.name}}.local'
            multiRoot: true

    global:
      - name: cilium
        description: eBPF-based CNI in chaining mode for network policy and observability
        version: 1.19.4
        mode: chaining
        chainingTarget: aws-cni
        enableHealthProbePolicy: true

      - name: cert-manager
        description: Certificate management for TLS
        version: 1.20.2
        namespace: cert-manager
        config:
          letsencrypt:
            enabled: true
            email: '{{env.acme.email}}'
            region: '{{env.aws.region}}'
