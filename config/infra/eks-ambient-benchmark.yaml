apiVersion: mesh.demo/v1
kind: InfraProfile
metadata:
  name: eks-ambient-benchmark
  description: EKS single cluster sized for the Solo Ambient mesh benchmark

spec:
  name: abench
  provider: eks
  environment: aws-abench

  settings:
    nodes:
      desired: 4
      type: m6i.2xlarge
      private: true

  clusters:
    - name: bench
      role: management

  vms:
    - name: loadgen
      role: workload
      cluster: bench
      instance_type: t3.large
