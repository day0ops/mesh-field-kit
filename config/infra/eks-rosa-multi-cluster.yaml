apiVersion: mesh.demo/v1
kind: InfraProfile
metadata:
  name: eks-rosa-multi-cluster
  description: EKS and ROSA (HCP) clusters in the same AWS region, for testing cross-cluster mesh federation between a standard EKS cluster and a ROSA cluster

spec:
  name: eks-rosa
  provider: eks-rosa

  settings:
    nodes: 2

  clusters:
    - name: eks-cluster
      cloud: eks
      region: ap-southeast-2
      role: management
      settings:
        node_type: t3.medium

    - name: rosa-cluster
      cloud: rosa
      region: ap-southeast-2
      role: workload
      settings:
        node_type: m5.xlarge
