apiVersion: mesh.demo/v1
kind: InfraProfile
metadata:
  name: hybrid-multi-cloud
  description: Hybrid multi-cloud setup with EKS, GKE and AKS workload clusters

spec:
  name: ridge
  provider: multicluster

  settings:
    nodes: 2

  clusters:
    - name: mgmt
      cloud: eks
      region: us-west-2
      role: management
      settings:
        node_type: t3.medium

    - name: gke-workload
      cloud: gke
      region: us-central1
      role: workload
      settings:
        node_type: n1-standard-2

    - name: aks-workload
      cloud: aks
      region: Australia East
      role: workload
      settings:
        node_type: Standard_D2_v2
