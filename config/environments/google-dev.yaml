apiVersion: mesh.demo/v1
kind: Environment
metadata:
  name: google-dev
  description: Google GKE environment

spec:
  gke:
    region: australia-southeast1

  acme:
    email: kasun.talwatta@solo.io

  tls:
    issuer: selfsigned-issuer

  keycloak:
    scheme: https

  addons:
    cert-manager:
      version: 1.21.2
    external-dns:
      version: 1.23.0
    telemetry:
      kube-prom-stack:
        version: 92.8.0
      loki:
        version: 7.3.0
      tempo:
        version: 1.61.3
      alloy:
        version: 1.13.0
      otel:
        version: 0.175.1

  images:
    keycloak: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/keycloak:26.7.0

  domains:
    core:
      keycloak: keycloak.ambient-demo-gke.kasunt.apac.fe.solo.io
      grafana: grafana.ambient-demo-gke.kasunt.apac.fe.solo.io
      soloUi: soloui.ambient-demo-gke.kasunt.apac.fe.solo.io
    app:
      main: app.ambient-demo-gke.kasunt.apac.fe.solo.io

  # Okta tenant
  okta:
    domain: integrator-1335842.okta.com
