apiVersion: mesh.demo/v1
kind: Environment
metadata:
  name: aws-dev
  description: AWS environment

spec:
  # AWS configuration
  aws:
    region: ap-southeast-1

  acme:
    email: kasun.talwatta@solo.io

  # DNS configuration for Route53
  dns:
    provider: route53
    parentZone:
      domain: kasunt.apac.fe.solo.io
      hostedZoneId: Z08818701HDZ6PBD6LPXU
    childZone: mesh-demo
    txtOwnerId: mesh-demo

  tls:
    issuer: letsencrypt-dns

  keycloak:
    scheme: https
    loginTheme: keycloak-soloio-login-theme

  soloUi:
    version: 0.5.7

  images:
    keycloak: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/keycloak:26.7.0

  # Internal cluster/mesh FQDNs (not publicly routable)
  internal:
    telemetry:
      otelTracesCollector: opentelemetry-collector-traces.telemetry.svc.cluster.local
      otelGatewayEndpoint: opentelemetry-collector-gateway.telemetry.mesh.internal
      lokiPushUrl: http://loki.telemetry.mesh.internal:3100/loki/api/v1/push
    soloUI:
      tunnelFqdn: solo-enterprise-ui.solo-enterprise.mesh.internal
      telemetryFqdn: solo-enterprise-telemetry-gateway.solo-enterprise.mesh.internal

  # Domain mappings - auto-generated pattern: <service>.<childZone>.<parentDomain>
  domains:
    core:
      keycloak: keycloak.mesh-demo.kasunt.apac.fe.solo.io
      grafana: grafana.mesh-demo.kasunt.apac.fe.solo.io
      soloUi: soloui.mesh-demo.kasunt.apac.fe.solo.io
    app:
      main: app.mesh-demo.kasunt.apac.fe.solo.io

  # Okta tenant
  okta:
    domain: integrator-1335842.okta.com

  # CIDR allowlist applied to public-facing NLBs (aws-load-balancer-source-ranges).
  # Checkpoint Harmony SASE documented egress range.
  security:
    vpnSourceRanges:
      - 165.99.148.61/32
      - 64.226.138.86/32
