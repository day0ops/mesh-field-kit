apiVersion: mesh.demo/v1
kind: UseCase
metadata:
  name: ambient-benchmark-direct
  description: 'Ambient mesh benchmark - direct comparison baseline. Gateway to account-service to ledger-service with no mesh component in the path: no ztunnel interception, no waypoint.'
spec:
  requires:
    applications:
      - name: ambient-mesh-benchmark
        namespace: ambient-mesh-benchmark
        dataplaneMode: none

  features:
    - name: gateway
      description: Create ingress gateway for the benchmark
      config:
        gatewayName: ambient-benchmark
        namespace: ambient-mesh-benchmark
        dataplaneMode: none
        gateway:
          listeners:
            - name: http
              hostname: ambient-benchmark.example.com
              port: 80
              protocol: HTTP
              allowedRoutes:
                namespaces:
                  from: Same

    - name: request-routing
      description: Route traffic to account-service
      config:
        routeName: ambient-benchmark
        namespace: ambient-mesh-benchmark
        dataplaneMode: none
        gatewayName: ambient-benchmark
        gatewayNamespace: ambient-mesh-benchmark
        hostname: ambient-benchmark.example.com
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: account-service
                port: 8080

  tests:
    - name: transfer-succeeds
      description: Verify a transfer succeeds through the direct path
      steps:
        - action: send-request
          hostname: ambient-benchmark.example.com
          autoDetectGwAddress: true
          method: POST
          path: /api/v1/transfers
          headers:
            Content-Type: application/json
          body: '{"fromAccount":"acc-001","toAccount":"acc-002","amount":1.00,"currency":"USD"}'
          timeout: 30s
        - action: verify
          expect:
            statusCode: 200
