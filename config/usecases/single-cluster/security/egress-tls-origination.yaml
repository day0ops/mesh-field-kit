apiVersion: mesh.demo/v1
kind: UseCase
metadata:
  name: egress-tls-origination
  description: >
    Egress waypoint re-encrypts traffic to external HTTPS services via
    DestinationRule TLS origination, with port mapping (80 -> 443).
spec:
  diagram: false

  requires:
    applications:
      - name: httpbin
        namespace: httpbin
      - name: curl
        namespace: httpbin

  features:
    - name: egress-waypoint
      description: Deploy egress waypoint
      config:
        waypointName: egress-waypoint
        namespace: egress

    - name: service-entry
      description: Register httpbin.org with port mapping 80->443
      config:
        entryName: httpbin-org-tls
        namespace: egress
        hosts:
          - httpbin.org
        location: MESH_EXTERNAL
        resolution: DNS
        ports:
          - number: 80
            name: http
            protocol: HTTP
            targetPort: 443
        waypointName: egress-waypoint

    - name: destination-rule
      description: TLS origination for httpbin.org
      config:
        ruleName: httpbin-org-tls
        namespace: egress
        host: httpbin.org
        trafficPolicy:
          tls:
            mode: SIMPLE

  tests:
    - name: egress-tls-origination
      description: Verify TLS origination re-encrypts traffic to external HTTPS service
      steps:
        - action: exec
          command: kubectl exec deploy/curl -n httpbin -- curl -s -o /dev/null -w '%{http_code}' http://httpbin.org/get
          timeout: 30s
        - action: verify
          expect:
            contains: "200"
