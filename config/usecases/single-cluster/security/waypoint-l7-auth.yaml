apiVersion: mesh.demo/v1
kind: UseCase
metadata:
  name: waypoint-l7-auth
  description: >
    L7 authorization policy enforcement through a waypoint proxy.
spec:
  diagram: false

  requires:
    applications:
      - name: bookinfo
        namespace: bookinfo

  features:
    - name: gateway
      description: Create ingress gateway for Bookinfo
      config:
        gatewayName: bookinfo
        namespace: bookinfo
        gateway:
          listeners:
            - name: http
              hostname: bookinfo.example.com
              port: 80
              protocol: HTTP
              allowedRoutes:
                namespaces:
                  from: Same

    - name: request-routing
      description: Route traffic to productpage
      config:
        routeName: bookinfo
        namespace: bookinfo
        gatewayName: bookinfo
        gatewayNamespace: bookinfo
        hostname: bookinfo.example.com
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: productpage
                port: 9080

    - name: waypoint
      description: Deploy waypoint proxy for bookinfo namespace
      config:
        waypointName: bookinfo-waypoint
        namespace: bookinfo
        labels:
          target: namespace

    - name: authorization-policy
      description: L7 allow GET requests to productpage only
      config:
        policyName: allow-get-productpage
        namespace: bookinfo
        action: ALLOW
        targetRefs:
          - kind: Gateway
            group: gateway.networking.k8s.io
            name: bookinfo-waypoint
        rules:
          - from:
              - source:
                  principals:
                    - cluster.local/ns/bookinfo/sa/bookinfo-istio
            to:
              - operation:
                  methods:
                    - GET
                  paths:
                    - /productpage
                    - /productpage/*

  tests:
    - name: bookinfo-accessible
      description: Verify bookinfo is accessible through L7 waypoint authorization
      steps:
        - action: send-request
          hostname: bookinfo.example.com
          autoDetectGwAddress: true
          path: /productpage
          timeout: 30s
        - action: verify
          expect:
            statusCode: 200
