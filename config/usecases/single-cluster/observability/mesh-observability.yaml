apiVersion: mesh.demo/v1
kind: UseCase
metadata:
  name: mesh-observability
  description: >
    Inspect ztunnel and istiod metrics for mesh-wide observability of L4
    traffic and control plane health.
spec:
  diagram: false

  requires:
    applications:
      - name: bookinfo
        namespace: bookinfo

  features:
    - name: gateway
      description: Create ingress gateway for Bookinfo
      config:
        gatewayName: bookinfo
        namespace: bookinfo
        gateway:
          listeners:
            - name: http
              hostname: bookinfo.example.com
              port: 80
              protocol: HTTP
              allowedRoutes:
                namespaces:
                  from: Same

    - name: request-routing
      description: Route traffic to productpage
      config:
        routeName: bookinfo
        namespace: bookinfo
        gatewayName: bookinfo
        gatewayNamespace: bookinfo
        hostname: bookinfo.example.com
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: productpage
                port: 9080

    - name: ztunnel-metrics
      description: Scrape ztunnel metrics for L4 traffic visibility
      config:
        namespace: istio-system
        metricsPort: 15020

    - name: istiod-metrics
      description: Scrape istiod metrics for control plane health
      config:
        namespace: istio-system
        metricsPort: 15014

  tests:
    - name: ztunnel-pods-running
      description: Verify ztunnel pods are running in istio-system
      steps:
        - action: exec
          command: kubectl get pods -n istio-system -l app=ztunnel -o jsonpath='{.items[0].status.phase}'
          timeout: 15s
        - action: verify
          expect:
            contains: Running

    - name: istiod-pods-running
      description: Verify istiod pods are running in istio-system
      steps:
        - action: exec
          command: kubectl get pods -n istio-system -l app=istiod -o jsonpath='{.items[0].status.phase}'
          timeout: 15s
        - action: verify
          expect:
            contains: Running
