apiVersion: mesh.demo/v1
kind: UseCase
metadata:
  name: kgateway-global-ingress
  description: |
    Route kgateway ingress traffic directly to a global mesh.internal hostname
    instead of the local Kubernetes Service, so the ingress keeps serving
    traffic even if every local backend pod is gone.
    - kgateway's HTTPRoute targets productpage.bookinfo.mesh.internal (a
      ServiceEntry-backed Hostname aggregating both clusters), not the local
      productpage Service
    - Scaling productpage-v1 to zero on east proves the ingress fails over to
      west automatically, which a Service-scoped backendRef could not do
    - See https://docs.solo.io/kgateway/2.3.x/integrations/istio/ambient/ingress-multi/
spec:
  diagram: |
    flowchart LR
      Client -->|HTTP| KGW[kgateway\nkgateway-system/east]
      KGW -->|HTTPRoute: Hostname backendRef| SE[productpage.bookinfo.mesh.internal]
      SE --> PPe[productpage east]
      SE --> PPw[productpage west]

  infra: eks-multi-cluster

  requires:
    applications:
      - name: bookinfo
        namespace: bookinfo
        clusters:
          - name: west
          - name: east

  features:
    - name: global-service
      description: Make productpage globally accessible across clusters
      config:
        namespace: bookinfo
        services:
          - name: productpage
            scope: global
      clusters:
        - name: west
        - name: east

    - name: ingress-httproute
      description: Route external traffic directly to the global productpage hostname
      config:
        gatewayName: bookinfo-gateway
        gatewayNamespace: kgateway-system
        namespace: bookinfo
        hostname: "{{env.domains.app}}"
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: productpage.bookinfo.mesh.internal
                port: 9080
                backendKind: Hostname
      clusters:
        - name: east

  tests:
    - name: httproute-resolves-global-hostname
      description: Verify the HTTPRoute's Hostname backendRef resolves against the global ServiceEntry
      clusters:
        - name: east
      steps:
        - action: exec
          command: kubectl get httproute bookinfo-gateway -n bookinfo -o jsonpath='{.status.parents[0].conditions[?(@.type=="ResolvedRefs")].status}'
          timeout: 20s
        - action: verify
          expect:
            contains: "True"

    - name: ingress-reachable
      description: Verify productpage is reachable through kgateway
      clusters:
        - name: east
      steps:
        - action: send-request
          hostname: "{{env.domains.app}}"
          autoDetectGwAddress: true
          path: /productpage
          timeout: 30s
          retries: 5
          retryDelay: 6000
        - action: verify
          expect:
            statusCode: 200

    - name: ingress-survives-local-backend-loss
      description: Verify ingress keeps serving productpage from west after scaling it to zero on east
      clusters:
        - name: east
      setup:
        - action: exec
          command: kubectl scale deploy/productpage-v1 -n bookinfo --replicas=0
          timeout: 30s
        - action: wait
          duration: 8000
      teardown:
        - action: exec
          command: kubectl scale deploy/productpage-v1 -n bookinfo --replicas=1
          timeout: 30s
      steps:
        - action: send-request
          hostname: "{{env.domains.app}}"
          autoDetectGwAddress: true
          path: /productpage
          timeout: 30s
          retries: 5
          retryDelay: 6000
        - action: verify
          expect:
            statusCode: 200
