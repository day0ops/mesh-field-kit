apiVersion: mesh.demo/v1
kind: UseCase
metadata:
  name: namespace-segmentation
  description: |
    Assign clusters to independently-addressed segments for DNS domain isolation
    across a multicluster mesh.
    - Segments partition the mesh at cluster granularity: west joins team-a,
      east joins team-b, by labeling each cluster's istio-system namespace
    - Segment CRs are created in istio-system on every peered cluster
spec:
  infra: eks-multi-cluster

  requires:
    applications:
      - name: bookinfo
        namespace: bookinfo
        clusters:
          - name: west
          - name: east

  features:
    - name: segment
      description: Create team-a segment and assign west to it
      config:
        segmentName: team-a
        domain: team-a.global
        assignCluster: west
      clusters:
        - name: west
        - name: east

    - name: segment
      description: Create team-b segment and assign east to it
      config:
        segmentName: team-b
        domain: team-b.global
        assignCluster: east
      clusters:
        - name: west
        - name: east

  tests:
    - name: segments-exist
      description: Verify both segments are created in istio-system on both clusters
      steps:
        - action: exec
          clusters:
            - name: west
          command: kubectl get segments -n istio-system -o name
          timeout: 15s
        - action: verify
          expect:
            contains:
              - segment.admin.solo.io/team-a
              - segment.admin.solo.io/team-b
        - action: exec
          clusters:
            - name: east
          command: kubectl get segments -n istio-system -o name
          timeout: 15s
        - action: verify
          expect:
            contains:
              - segment.admin.solo.io/team-a
              - segment.admin.solo.io/team-b

    - name: clusters-assigned-to-segments
      description: Verify west is assigned to team-a and east is assigned to team-b
      steps:
        - action: exec
          clusters:
            - name: west
          command: kubectl get namespace istio-system -o jsonpath='{.metadata.labels.admin\.solo\.io/segment}'
          timeout: 15s
        - action: verify
          expect:
            contains: team-a
        - action: exec
          clusters:
            - name: east
          command: kubectl get namespace istio-system -o jsonpath='{.metadata.labels.admin\.solo\.io/segment}'
          timeout: 15s
        - action: verify
          expect:
            contains: team-b
