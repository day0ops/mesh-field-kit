apiVersion: mesh.demo/v1
kind: UseCase
metadata:
  name: segment-scoped-services
  description: |
    Services labeled solo.io/service-scope=segment are visible only within their
    segment across clusters, demonstrating team-scoped multi-cluster visibility.
    - west is assigned to the team-a segment; east remains outside it
    - bookinfo services in west get a team-a.global-scoped hostname
    - east cannot see the team-a-scoped hostname since it isn't in that segment
spec:
  infra: eks-multi-cluster

  requires:
    applications:
      - name: bookinfo
        namespace: bookinfo
        clusters:
          - name: west
          - name: east

  features:
    - name: segment
      description: Create team-a segment and assign west to it
      config:
        segmentName: team-a
        domain: team-a.global
        assignCluster: west
      clusters:
        - name: west
        - name: east

    - name: global-service
      description: Scope bookinfo services to the team-a segment in west
      config:
        namespace: bookinfo
        services:
          - name: productpage
            scope: segment
          - name: reviews
            scope: segment
      clusters:
        - name: west

  tests:
    - name: segment-scoped-hostname-exists-in-west
      description: Verify a team-a-scoped ServiceEntry hostname is created in west
      clusters:
        - name: west
      steps:
        - action: exec
          command: kubectl get serviceentry -n istio-system -o jsonpath='{.items[*].spec.hosts[*]}'
          timeout: 20s
        - action: verify
          expect:
            contains:
              - reviews.bookinfo.team-a.global

    - name: segment-scoped-hostname-not-visible-in-east
      description: Verify east (not in team-a) does not see the team-a-scoped hostname
      clusters:
        - name: east
      steps:
        - action: exec
          command: kubectl get serviceentry -n istio-system -o jsonpath='{.items[*].spec.hosts[*]}'
          timeout: 20s
        - action: verify
          expect:
            notContains:
              - reviews.bookinfo.team-a.global
