apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  labels:
    app: redpanda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
        - name: redpanda
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command:
            - rpk
            - redpanda
            - start
            - --mode=dev-container
            - --kafka-addr=0.0.0.0:9092
            - --advertise-kafka-addr=redpanda.{{ .Release.Namespace }}.svc.cluster.local:9092
          ports:
            - containerPort: 9092
              name: kafka
