# kube-prometheus-stack values for Istio Ambient mesh observability
# Ref: https://docs.solo.io/gloo-mesh/main/setup/observability/prometheus/
# Ref: https://docs.solo.io/gloo-mesh/main/setup/observability/grafana/

alertmanager:
  enabled: false

defaultRules:
  create: false

nodeExporter:
  enabled: false

kubeStateMetrics:
  enabled: true

# Disable built-in Kubernetes component scrapers (not relevant for Istio mesh observability)
kubernetesServiceMonitors:
  enabled: false
kubeApiServer:
  enabled: false
kubelet:
  enabled: false
kubeControllerManager:
  enabled: false
coreDns:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    enableRemoteWriteReceiver: true
    # retention is set via TelemetryFeature config (--set prometheus.prometheusSpec.retention)
    # Scraping handled by opentelemetry-collector-metrics on each cluster via remote-write.
    # East cluster: otel-metrics scrapes locally and remote-writes here.
    # West cluster: otel-metrics scrapes locally and sends via east otel-gateway which remote-writes here.
    additionalScrapeConfigs: []
    # REMOVED: istiod, ztunnel, gateway, kgateway-controlplane scrape jobs.
    # All now owned by opentelemetry-collector-metrics (standard collector set on both clusters).

grafana:
  enabled: true
  defaultDashboardsEnabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: '1'
      searchNamespace: ALL
    datasources:
      enabled: true
      defaultDatasourceEnabled: false
      # Sidecar watches for ConfigMaps with grafana_datasource=1 and reloads Grafana when found.
      # Grafana's reload API is admin-only, so reloadURL (carrying the admin credentials) is
      # injected at deploy time via --set-string by TelemetryFeature.installPrometheusStack.
      skipReload: false
      label: grafana_datasource
      labelValue: '1'
